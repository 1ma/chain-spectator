name: chain-spectator

services:
  caddy:
    image: caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b # :alpine
    depends_on:
      - php-fpm
    ports:
      - "127.0.0.1:80:80"
    restart: on-failure
    volumes:
      - ./etc/docker/Caddyfile:/etc/caddy/Caddyfile
      - ./public:/var/www/chain-spectator/public
      - caddy_config:/config
      - caddy_data:/data

  php-fpm:
    image: 1maa/php:8.5
    restart: on-failure
    volumes:
      - .:/var/www/chain-spectator
    working_dir: /var/www/chain-spectator

  node:
    image: 1maa/bitcoin:latest
    command: -regtest -txindex=1 -walletimplicitsegwit=1
    healthcheck:
      test: netstat -ltn | grep 18443 > /dev/null
      start_interval: 125ms
      start_period: 500ms
    restart: on-failure
    volumes:
      - node_data:/home/bitcoin/.bitcoin

volumes:
  caddy_config:
  caddy_data:
  node_data:
  valkey_data:
